name: Azure observability

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/azure-observability.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, test, prod]
      location:
        description: Azure region
        required: true
        default: eastus
        type: string
      resourceGroupName:
        description: Observability resource group
        required: true
        default: rg-daes-observability
        type: string
      workspaceName:
        description: Log Analytics workspace
        required: true
        default: log-daes-observability
        type: string
      applicationInsightsName:
        description: Application Insights resource
        required: true
        default: appi-daes-observability
        type: string
      eventPublisherPrincipalIds:
        description: JSON array of managed-identity principal IDs
        required: true
        default: "[]"
        type: string
      alertEmail:
        description: Optional alert recipient
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep
      - name: Install webhook dependencies
        run: python -m pip install --requirement infra/github-webhook/requirements.txt
      - name: Test webhook package
        working-directory: infra/github-webhook
        run: python -m unittest discover -v
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy observability resources
        id: deploy
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_LOCATION: ${{ inputs.location }}
          RESOURCE_GROUP_NAME: ${{ inputs.resourceGroupName }}
          WORKSPACE_NAME: ${{ inputs.workspaceName }}
          APPLICATION_INSIGHTS_NAME: ${{ inputs.applicationInsightsName }}
          EVENT_PUBLISHER_PRINCIPAL_IDS: ${{ inputs.eventPublisherPrincipalIds }}
          ALERT_EMAIL: ${{ inputs.alertEmail }}
        run: |
          jq -e 'type == "array" and all(.[]; type == "string" and test("^[0-9a-fA-F-]{36}$"))' <<< "$EVENT_PUBLISHER_PRINCIPAL_IDS" > /dev/null
          az deployment sub create \
            --name "samasara-observability-${DEPLOY_ENVIRONMENT}-${GITHUB_RUN_NUMBER}" \
            --location "$DEPLOY_LOCATION" \
            --template-file infra/main.bicep \
            --parameters \
              location="$DEPLOY_LOCATION" \
              resourceGroupName="$RESOURCE_GROUP_NAME" \
              environment="$DEPLOY_ENVIRONMENT" \
              workspaceName="$WORKSPACE_NAME" \
              applicationInsightsName="$APPLICATION_INSIGHTS_NAME" \
              alertEmail="$ALERT_EMAIL" \
              deployRoleAssignments=true \
              eventPublisherPrincipalIds="$EVENT_PUBLISHER_PRINCIPAL_IDS" \
            --query properties.outputs \
            --output json > deployment-outputs.json
          echo "function_name=$(jq -r '.webhookFunctionName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Package webhook function
        working-directory: infra/github-webhook
        run: zip -r ../../github-webhook.zip . -x "test_*" "__pycache__/*"
      - name: Deploy webhook function
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ inputs.resourceGroupName }}" \
            --name "${{ steps.deploy.outputs.function_name }}" \
            --src github-webhook.zip
